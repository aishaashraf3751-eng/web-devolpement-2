<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
        }
        
        .fact-file {
            background-color: light yellow;
            border: 4px solid #000000;
            border-radius: 10px;
            padding: 25px;
            width: 260px;
            margin: 30px;
            
        }

        .animal-name {
            color:blue;
            font-size: 24px;
        }

        .detail {
            color: aqua;
        }

        .cool-fact {
            color: darkblue;
            font-style: italic;
        }
    </style>
    
</head>
<body>
    
    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: Big Cat</p>
        <p class="detail">Habitat: Mountainous regions of Central and South Asia</p>
        <p class="detail">Diet: Carnivorous, primarily hunting wild sheep and goats</p>
        <p class="cool-fact">Cool Fact: Snow leopards can run up to 36 mph (58 km/h)</p>
    </div>
</body>
</html>
