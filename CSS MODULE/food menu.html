<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body{
            font-family: Arial;
            background: peachpuff;
            padding: 50px;
            text-align: center;
        }

        h1 {color:black}
        
        h1+p {
            background: coral;
            padding: 10px 20px;
            border-radius: 8px;
            color:antiquewhite;
            display: inline-block;
        }

        ul { padding:0; margin-top: 20px;}

        ul > li {
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            color:aqua;
            padding: 10px 20px;
            margin: 6px auto;
            width: 260px;
            background: yellow;
        }

        ul li:nth-child(3) {
            background: red;
            color:bisque;
        }

        .desc {
            color:blue;
            margin-top: 20px;
            font-size: 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .desc::first-letter {
            font: size 220%;
            color: yellow;
            font-weight: bold;

        }

        .links { margin-top: 25px}

        a {
            color:aqua;
            text-decoration: none;
            font-size: 15px;
            margin:0 12px;
            padding: 8px 18px;
            border: 2px solid lightblue;
            border-radius: 8px;
        }

        a:hover {
            background: coral;
            color: white;
        }
        
    </style>
</head>
<body>
    
    <h1>My Food Menu</h1>
    <p>Pick your favourite dish and dig in!</p>

    <ul>
        <li>Pizza</li>
        <li>Burger</li>
        <li>tacos - Chefs Special</li>
        <li>Noodles</li>
        <li>Ice Cream</li>
    </ul>

    <P class="desc">Every dish on this menu is made with love and
        loads of flovour. Try them all and find your favourte!
    </P>

    <div class="links"
    <a href="#">Order Now</a>
    <a href="#">See More</a>
</div>
</body>
</html>
