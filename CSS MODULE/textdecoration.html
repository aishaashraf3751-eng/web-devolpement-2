<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    body {
        background-color: darkblue;
        color: white;
        font-family: Arial, sans-serif;
    }

    .hero-name {
        font-size: 60px;
        font-weight: bold;
        color: yellow;
        text-shadow: 3px 3px orange;
    }

    .tagline {
        font-style: italic;
        color: lightblue;
        text-transform: capitalize;

        
    }

    .label {
        text-transform: uppercase;
        text-decoration: underline;
        color: coral;


    }

    .power {
        font-weight: bold;
        color: lightgreen;
    }

    .badge {
        font-size: 20px;
        font-weight: bold;
        color: gold;
        transform: rotate(15deg);
    }

    .made-by {
        color: coral;
        font-style: italic;
    }

    
    </style>
</head>

<body>

    <h1 class="food">My Restraunt Menu</h1>
    <p class="tagline">Here are some things you can order from our restraunt!</p>

    <h2 class="label">super powers</h2>
    <p class="powers">can run faster than a cheetah</p>
    <p class="powers">can lift a school bus</p>

    <h2 class="label">weaknesses</h2>
    <p class="weakness">maths homework</p>
    <p class="weakness">Broccoli</p>

    <p class="badge">Top Hero</p>

    <p class="made-by">Created by: Umer Ashraf</p>

</body>
</html>
