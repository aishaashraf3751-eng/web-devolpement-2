<html>
<head>
    <link rel="stylesheet" type="text/css" href="index.css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:600,700" rel="stylesheet">
</head>
<body>
<div id="container">
    <div id="calculator">
        <div id="result">
            <div id="history">
                <p id="history-value"></p>
            </div>
            <div id="output">
                <p id="output-value"></p>
            </div>
        </div>
        <div id="keyboard">
            <button class="operator" id="clear">C</button>
            <button class="operator" id="backspace">CE</button>
            <button class="operator" id="%">%</button>
            <button class="operator" id="/">/</button>
            <button class="number" id="7">7</button>
            <button class="number" id="8">8</button>
            <button class="number" id="9">9</button>
            <button class="operator" id="*">*</button>
            <button class="number" id="4">4</button>
            <button class="number" id="5">5</button>
            <button class="number" id="6">6</button>
            <button class="operator" id="-">-</button>
            <button class="number" id="1">1</button>
            <button class="number" id="2">2</button>
            <button class="number" id="3">3</button>
            <button class="operator" id="+">+</button>
            <button class="empty" id="empty"></button>
            <button class="number" id="0">0</button>
            <button class="empty" id="empty"></button>
            <button class="operator" id="=">=</button>
        </div>
    </div>
</div>
<script src="script.js"></script>



<div id="app">

    <h1 id="app-title">umer's bank</h1>

    <div id="balance-box">
        <p id="balance-label">available balance</p>
        <p id="balance">1000</p>
    </div>

    <div id="entry-box">
        <label id="amount-label" for="amount">Enter amount</label>
        <input type="number" id="amount" placeholder:"0">
     </div>

     <div id="button-box">
        <button class="action credit" id="credit-btn">Credit</button>
        <button class="action debit" id="debit-btn">Debit</button>


     </div>
     <p id-="message"></p>
     <p id="note">                              Terms  and  Conditions  applied</p>
     
        
    
</div>
    
</body>
</html>
