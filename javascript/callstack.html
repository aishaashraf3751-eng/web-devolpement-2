<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Call Stack</h1>
    <p>the call stack is a mechanism for an interpreter to keep track of its place in a script that calls multiple functions. the call stack is a stack data structure that stores information about the active subroutines of a computer program.

    </p>
    <p id="demo"></p>
    <script>
        function add (a,b){
            return a+b;
        }
        function average(a,b){
            return add(a,b)/2;
        }
        let result = average(10,20);
        document.getElementById("demo").innerHTML = result;
    </script>
</body>
</html>
