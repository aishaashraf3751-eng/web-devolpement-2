<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

body {

font-family: Arial;

background: #f0f4ff;

padding: 30px;

text-align: center;

}

h1 { color: #ff5a43; }

p { color: #555; }

.cards {

display: flex;

justify-content: center;

gap: 20px;

margin-top: 25px;

}

.card {

background: white;

border: 3px solid #ff5a43;

border-radius: 12px;

padding: 20px;

width: 200px;

}

.planet-name {

font-size: 22px;

font-weight: bold;

color: #333;

}

.planet-fact { color: #666; margin-top: 10px; font-size: 14px; }

button {

background: #ff5a43;

color: white;

border: none;

padding: 12px 28px;

border-radius: 8px;

cursor: pointer;

font-size: 16px;

margin-top: 10px;

}

</style>
</head>
<body>
    <h1>MY PLANET CARDS</h1>
    <p>use a javascript class to build planet cards</p>
    <button onclick="showplants()">Show Planets</button>
    <div class="cards">
        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
    </div>

    <script>
        class Planet {
            constructor(name, fact) {
                this.name = name;
                this.fact = fact;
            }
            describe() {
                return this.name + ": " + this.fact;
            }
        }

        function showplants() {
            let planet1 = new Planet("Mercury", "The smallest planet in our solar system.");
            let planet2 = new Planet("Venus", "The hottest planet in our solar system.");
            let planet3 = new Planet("Earth", "The only planet known to support life.");

             document.getElementById("card1").innerHTML =
             "<div class='card'><div class='planet-name'>" + planet1.name + "</div><div class='planet-fact'>" + planet1.fact + "</div></div>";

                document.getElementById("card2").innerHTML =
                "<div class='card'><div class='planet-name'>" + planet2.name + "</div><div class='planet-fact'>" + planet2.fact + "</div></div>";

                document.getElementById("card3").innerHTML =
                "<div class='card'><div class='planet-name'>" + planet3.name + "</div><div class='planet-fact'>" + planet3.fact + "</div></div>";

        }

    </script>
</body>
</html>
