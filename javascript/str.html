<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>javascript string methods</h2>
    <p>basic methods for manipulating strings in javascript</p>
    <script>
        var str = "AmAzInG" ;
        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(str.startsWith("i"));
        document.write("<br>");

        //test method - retuens  true or false
        var str1 = "I learnt about methods";
        var patt = newRegExp("about");
        var res = patt.test(str1);
        document.write(res);
    </script>
</body>
</html>
